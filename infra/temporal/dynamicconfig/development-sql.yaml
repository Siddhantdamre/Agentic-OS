# Temporal Dynamic Config — Development with SQL backend
# Relaxed rate limits and timeouts suitable for local development.
# File: infra/temporal/dynamicconfig/development-sql.yaml

frontend.enableClientVersionCheck:
  - value: false
    constraints: {}

history.persistenceMaxQPS:
  - value: 3000
    constraints: {}

frontend.persistenceMaxQPS:
  - value: 3000
    constraints: {}

frontend.historyMgrNumShards:
  - value: 4
    constraints: {}

frontend.throttledLogRPS:
  - value: 20
    constraints: {}

history.historyMgrNumShards:
  - value: 4
    constraints: {}

system.advancedVisibilityWritingMode:
  - value: "off"
    constraints: {}

frontend.enableServerVersionCheck:
  - value: false
    constraints: {}

# Allow larger payload sizes for development (conversation histories can be large)
frontend.grpcMaxSizeInByte:
  - value: 67108864  # 64 MB
    constraints: {}
