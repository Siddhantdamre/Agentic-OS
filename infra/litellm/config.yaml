# LiteLLM Proxy Config — DareX model router
# Routes the atomic-agent through LiteLLM using DeepSeek via OpenRouter:
#   1) deepseek/deepseek-v4-flash-0731              (primary model via OpenRouter)
#   2) deepseek/deepseek-v4-flash-0731              (fallback model via OpenRouter)
# The atomic-agent always calls model "atomic-agent"; LiteLLM owns failover.
# File: infra/litellm/config.yaml

model_list:
  - model_name: atomic-agent
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat

  # Tier 2 — PAID, a different vendor from tier 1.
  #
  # Both fallbacks were :free models until reliability run 17, which failed on
  # "Rate limit exceeded: free-models-per-day-high-balance". OpenRouter caps
  # free models per DAY regardless of account balance, so under sustained load
  # the failover chain was the first thing to break — the exact opposite of
  # what a failover chain is for. A fallback that runs out is not a fallback.
  #
  # ~$0.15 per 1M prompt tokens: fractions of a cent per agent turn, and it
  # only runs at all once tier 1 has already failed.
  - model_name: atomic-agent-fallback
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat

  # Tier 3 — FREE, deliberately. The zero-cost floor.
  #
  # Making all three tiers paid was a mistake and the logs showed it within one
  # run: the balance hit zero and EVERY tier returned 402 at once, so 11 of 12
  # cases got no reply. Free models have a daily cap (which is what broke run
  # 17 before), but a capped tier still answers when the balance is empty, and
  # an empty balance is the more likely failure — it arrives without warning
  # and takes the paid tiers down together.
  #
  # So the chain now degrades along two independent axes:
  #   tiers 1-2  paid, different vendors  → survive a provider outage
  #   tier 3     free                     → survives an empty wallet
  # Nothing here can be exhausted by the same event.
  - model_name: atomic-agent-deepseek
    litellm_params:
      # Verified present in the live OpenRouter catalogue and listed as
      # supporting tool calling, which the agent loop requires. The obvious
      # guess — llama-3.3-70b-instruct:free — does not exist; a model id that
      # is merely plausible fails silently at the moment failover is needed.
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat

  # ── SECOND PAYMENT RAIL ───────────────────────────────────────────────────
  #
  # Tiers 1-3 above all bill the same OpenRouter account. When that balance hit
  # zero, all three returned 402 within the same second and 11 of 12 test cases
  # got no reply. Three models on one exhausted account is one point of
  # failure wearing a disguise.
  #
  # These two tiers use DIRECT provider keys with their own separate balances,
  # so an empty OpenRouter wallet cannot touch them. Both are OPTIONAL: if the
  # key is absent the call fails immediately and the router moves to the next
  # tier, which is exactly what a fallback chain is for. Nothing breaks by
  # leaving them unset — you simply have one rail instead of two.
  #
  # To enable, add either (or both) to infra/.env:
  #   DEEPSEEK_API_KEY=...   from platform.deepseek.com
  #   GROQ_API_KEY=...       from console.groq.com  (has a real free tier)
  - model_name: atomic-agent-direct
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      mode: chat

  # Groq is last because its free tier is generous enough to keep a demo alive
  # with no payment method configured at all — the floor beneath the floor.
  - model_name: atomic-agent-groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
    model_info:
      mode: chat

  # EMBEDDING_MODEL (worker/embed activity) must name a model_name defined
  # here — the docker-compose default of "text-embedding-3-small" has no
  # OpenAI key in this deployment, so route it to Gemini's embedding model
  # instead via the same name the workers already expect.
  - model_name: text-embedding-3-small
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: embedding

litellm_settings:
  default_team_id: darex-default
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  langfuse_host: http://darex-langfuse-server:3000

router_settings:
  enable_pre_call_checks: false
  request_timeout: 60
  # Ordered so that consecutive tiers never share a failure mode:
  #   1 openrouter paid   — normal traffic
  #   2 openrouter paid   — different vendor, survives a provider outage
  #   3 openrouter free   — survives an empty OpenRouter balance (daily cap)
  #   4 deepseek direct   — SEPARATE account, survives OpenRouter entirely
  #   5 groq direct       — separate again, real free tier, survives no-payment
  # Tiers 4 and 5 are skipped instantly when their keys are unset.
  fallbacks:
    - atomic-agent:
        - atomic-agent-fallback
        - atomic-agent-deepseek
        - atomic-agent-direct
        - atomic-agent-groq
  retry_policy:
    timeout: 0
    RateLimitError: 2
    InternalServerError: 2
    BadRequestError: 0
    AuthenticationError: 0
    ContentPolicyViolationError: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
