# LiteLLM Proxy Config — DareX model router
# Routes the default DareX chat model through LiteLLM using Gemini Flash Lite
# with Groq (gpt-oss-120b / gpt-oss-20b) as reliable fallbacks.
# Plain chat-completion callers (classify/plan/critic) use model "darex-default";
# LiteLLM owns failover. The agent tool loop itself runs in TrueForge.
# File: infra/litellm/config.yaml

model_list:
  - model_name: darex-default
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat

  - model_name: darex-default
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat

  - model_name: darex-default-fallback
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
    model_info:
      mode: chat

  - model_name: darex-default-fallback
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
    model_info:
      mode: chat

  # ---- Quality tiers (used only when DAREX_TIER_ROUTING=1; see services/workflows/src/model-tier.ts) ----------
  # standard: everyday analysis. deep: money, promises, complaints, legal. Each alias lists providers in order;
  # an alias whose key is not set simply fails over to the next one and finally to darex-default.
  - model_name: darex-standard
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
  - model_name: darex-standard
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
  - model_name: darex-deep
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      mode: chat
  - model_name: darex-deep
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat

  - model_name: text-embedding-3-small
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: embedding

litellm_settings:
  default_team_id: darex-default
  # Cost accounting (RT-G01): every proxied call lands in Langfuse, which is
  # what the llm_tokens meter reads (billing/_lib.ts, userId = orgId).
  # Callers pass `user: <orgId>` and `metadata.trace_user_id`; keys and host
  # come from LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

router_settings:
  enable_pre_call_checks: false
  request_timeout: 60
  fallbacks:
    - darex-default:
        - darex-default-fallback
    - darex-standard:
        - darex-default
    - darex-deep:
        - darex-standard
  retry_policy:
    timeout: 0
    RateLimitError: 2
    InternalServerError: 2
    BadRequestError: 0
    AuthenticationError: 0
    ContentPolicyViolationError: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
