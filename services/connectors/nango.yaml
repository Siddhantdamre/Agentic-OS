    capabilities:
      repositories:
        - metadata:read
        - contents:read
        - contents:write
        - issues:read
        - issues:write
        - pull_requests:read
        - pull_requests:write
        - deployments:read
        - deployments:write
        - actions:read
        - actions:write
        - checks:read
        - checks:write
        - discussions:read
        - discussions:write
        - workflows:read
        - workflows:write
        - releases:read
        - releases:write
        - environments:read
        - environments:write
        - webhooks:read
        - webhooks:write
        - security_events:read
        - statuses:read
        - statuses:write
      organization:
        - members:read
        - members:write
        - administration:read
        - administration:write
        - organization_projects:read
        - organization_projects:write
      account:
        - profile:read
        - email:read
    sync:
      mode: webhook
      entities: [repositories, issues, pull_requests, commits, releases]
      webhook_events: [pull_request_created, issue_created]


