# ============================================================
# Company Brain - Nango Integration Registry
# services/connectors/nango.yaml
#
# Scope of this file:
#   Only connectors visible in the DarexAI connector dashboard
#   (WhatsApp, Gmail, Google Calendar, Google Ads, Meta Ads,
#   HubSpot, Stripe, Notion, Slack, Shopify, Zendesk, Intercom,
#   GitHub, Razorpay, Google Drive/Docs/Sheets) PLUS the full
#   Google Workspace / Google Cloud app family, since Google is
#   the deepest ecosystem in use.
#
# Permission strategy:
#   - Request maximum useful scopes/capabilities supported by
#     each provider (broadest read+write, not least-privilege)
#   - Every integration gets sync + webhook + MCP exposure
#   - Support OAuth2, API_KEY, GITHUB_APP, CONNECTION_STRING
#
# IMPORTANT:
#   Provider scopes may require app verification, admin consent,
#   business verification, or additional approval before granted
#   in production (this applies especially to Google, Meta, and
#   Microsoft broad scopes).
# ============================================================

version: "2"

defaults:
  enabled: true
  sync_enabled: true
  webhook_enabled: true
  mcp_enabled: true
  retry_enabled: true
  retry_max_attempts: 5
  retry_backoff: exponential
  pagination_enabled: true
  token_refresh_enabled: true
  audit_logging: true

integrations:

  # ============================================================
  # GOOGLE ECOSYSTEM (full suite)
  # ============================================================

  google:
    display_name: "Google (umbrella / SSO)"
    auth_mode: OAUTH2
    categories: [google, productivity, cloud]
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    access_type: offline
    prompt: consent
    include_granted_scopes: true
    scopes:
      # Identity
      - openid
      - email
      - profile
      # Gmail - maximum broad mailbox access
      - https://mail.google.com/
      - https://www.googleapis.com/auth/gmail.modify
      - https://www.googleapis.com/auth/gmail.labels
      - https://www.googleapis.com/auth/gmail.settings.basic
      - https://www.googleapis.com/auth/gmail.settings.sharing
      # Calendar
      - https://www.googleapis.com/auth/calendar
      - https://www.googleapis.com/auth/calendar.acls
      - https://www.googleapis.com/auth/calendar.calendarlist
      - https://www.googleapis.com/auth/calendar.calendars
      - https://www.googleapis.com/auth/calendar.events
      - https://www.googleapis.com/auth/calendar.settings.readonly
      # Drive
      - https://www.googleapis.com/auth/drive
      - https://www.googleapis.com/auth/drive.metadata
      - https://www.googleapis.com/auth/drive.activity
      - https://www.googleapis.com/auth/drive.apps.readonly
      - https://www.googleapis.com/auth/drive.meet.readonly
      - https://www.googleapis.com/auth/drive.photos.readonly
      - https://www.googleapis.com/auth/drive.scripts
      # Docs / Sheets / Slides / Forms
      - https://www.googleapis.com/auth/documents
      - https://www.googleapis.com/auth/spreadsheets
      - https://www.googleapis.com/auth/presentations
      - https://www.googleapis.com/auth/forms.body
      - https://www.googleapis.com/auth/forms.responses.readonly
      # Tasks
      - https://www.googleapis.com/auth/tasks
      # Contacts / People / Directory
      - https://www.googleapis.com/auth/contacts
      - https://www.googleapis.com/auth/contacts.other.readonly
      - https://www.googleapis.com/auth/directory.readonly
      # Meet / Chat
      - https://www.googleapis.com/auth/meetings.space.created
      - https://www.googleapis.com/auth/meetings.space.readonly
      - https://www.googleapis.com/auth/chat.messages
      - https://www.googleapis.com/auth/chat.messages.readonly
      - https://www.googleapis.com/auth/chat.spaces
      - https://www.googleapis.com/auth/chat.spaces.readonly
      # Ads / Analytics / Search Console / Business
      - https://www.googleapis.com/auth/adwords
      - https://www.googleapis.com/auth/analytics
      - https://www.googleapis.com/auth/analytics.readonly
      - https://www.googleapis.com/auth/webmasters
      - https://www.googleapis.com/auth/webmasters.readonly
      - https://www.googleapis.com/auth/business.manage
      # Cloud
      - https://www.googleapis.com/auth/cloud-platform
    capabilities:
      - profile.read
      - directory.read
    sync:
      mode: incremental
      entities: [users, contacts, calendar_events, emails, files]

