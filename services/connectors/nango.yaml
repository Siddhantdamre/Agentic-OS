  # ============================================================

  microsoft-outlook:
    display_name: "Microsoft Outlook"
    dashboard_status_ref: "Microsoft Outlook — EMAIL"
    auth_mode: OAUTH2
    categories: [microsoft, email, communication]
    authorization_url: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url: https://login.microsoftonline.com/common/oauth2/v2.0/token
    scopes:
      - offline_access
      - openid
      - email
      - profile
      - User.Read
      - Mail.Read
      - Mail.ReadWrite
      - Mail.Send
    capabilities:
      - messages.read
      - messages.send
      - drafts.write
    sync:
      mode: incremental
      entities: [emails, threads]

  microsoft-calendar:
    display_name: "Microsoft Calendar"
    dashboard_status_ref: "Microsoft Calendar — CALENDAR"
