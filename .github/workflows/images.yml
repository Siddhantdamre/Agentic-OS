# Builds the Docker images on GitHub's runners and pushes them to GHCR, tagged with the commit
# SHA. deploy/redeploy.sh pulls the image for the commit it deploys instead of compiling on the
# production VM (a 2 vCPU box shared with other projects: next build took 13+ minutes there).
# Every push to main builds, so an image exists for every deployable commit; unchanged layers
# come from the Actions cache. Services here must match PREBUILT_SERVICES in deploy/lib.sh.
# mcp-bridge is not built here: it is `FROM darex-dashboard:local` and builds in seconds on the VM.
name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.svc }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: dashboard, context: ".", file: infra/docker/dashboard/Dockerfile }
          - { svc: worker, context: ".", file: infra/docker/worker/Dockerfile }
          - { svc: inbox, context: apps/inbox, file: apps/inbox/Dockerfile }
          - { svc: sandbox, context: infra/docker/sandbox, file: infra/docker/sandbox/Dockerfile }
    steps:
      - uses: actions/checkout@v5

      # GHCR wants a lowercase repository path.
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/darex-${{ matrix.svc }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:main
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,scope=${{ matrix.svc }},mode=max
