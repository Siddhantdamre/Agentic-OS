# Single source of truth for every host port the production stack publishes.
# Change a port here and nothing else: deploy.sh / redeploy.sh load this file (via lib.sh),
# infra/scripts/compose-cmd.sh passes it to compose for the prod overlay, and
# deploy/docker-compose.prod.yml reads these names with no inline defaults.
# Public site is Caddy -> FRONTEND_HOST_PORT; point the proxy's upstream at that value
# (deploy/Caddyfile.example). A per-machine override can still go in .env (it loads after this).
# Everything binds 127.0.0.1 only; these are host-side ports, container ports never change.
# No secrets in this file.

# App
FRONTEND_HOST_PORT=13100
DASHBOARD_PORT=13000
NANGO_HOST_PORT=13003
INBOX_HOST_PORT=13004
MCP_BRIDGE_HOST_PORT=18790
SANDBOX_HOST_PORT=18080
