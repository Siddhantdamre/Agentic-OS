# Single source of truth for every host port the production stack publishes.
# Change a port here and nothing else: deploy.sh / redeploy.sh load this file (via lib.sh),
# infra/scripts/compose-cmd.sh passes it to compose for the prod overlay, and
# deploy/docker-compose.prod.yml reads these names with no inline defaults.
# Public site is Caddy -> FRONTEND_HOST_PORT; point the proxy's upstream at that value
# (deploy/Caddyfile.example). A per-machine override can still go in .env (it loads after this).
# Everything binds 127.0.0.1 only; these are host-side ports, container ports never change.
# No secrets in this file.
#
# This VM is shared with other projects. Darex owns 10000-19999 and nothing else; the guard in
# deploy/lib.sh (check_port_ownership) refuses to deploy when a port is outside that range,
# listed below, used twice, or already held by anything that is not a darex-* container.
# Who else is on the box (see deploy/SERVER.md): mtip 80/443 + 47000-47999, WA-AKG 3030/3306,
# TrueForge 8085/8791, openclaw-gateway 18789 (inside our range, so it is reserved here).
DAREX_PORT_MIN=10000
DAREX_PORT_MAX=19999
# Space-separated ports other projects use that fall inside the range above.
OTHER_PROJECTS_PORTS="18789"

# App
FRONTEND_HOST_PORT=13100
DASHBOARD_PORT=13000
NANGO_HOST_PORT=13003
INBOX_HOST_PORT=13004
MCP_BRIDGE_HOST_PORT=18790
SANDBOX_HOST_PORT=18080
EVOLUTION_PORT=18085

# Data + platform
POSTGRES_HOST_PORT=15432
PGBOUNCER_HOST_PORT=16432
REDIS_HOST_PORT=16379
TEMPORAL_HOST_PORT=17233
TEMPORAL_UI_HOST_PORT=18233
SUPERTOKENS_HOST_PORT=13567
LITELLM_HOST_PORT=14000

# Observability + memory
LANGFUSE_HOST_PORT=13002
CLICKHOUSE_HTTP_HOST_PORT=18123
CLICKHOUSE_NATIVE_HOST_PORT=19000
MINIO_API_HOST_PORT=19090
MINIO_CONSOLE_HOST_PORT=19091
HINDSIGHT_UI_HOST_PORT=19999

# Search + extraction
SEARXNG_HOST_PORT=18088
CRAWL4AI_HOST_PORT=11235
