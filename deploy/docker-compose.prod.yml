# Production overlay for infra/docker-compose.yml.
# Callers: deploy/deploy.sh (via infra/scripts/compose-cmd.sh --overlay).
# Bind admin/data ports to loopback so they are not on the public internet.
# Put Caddy/nginx in front of 127.0.0.1:3000.
#
#   bash infra/scripts/compose-cmd.sh --overlay deploy/docker-compose.prod.yml up -d
#
# File order: kernel → compose-snippets → this overlay (later wins).
# `ports: !override` is required: plain `ports:` APPENDS to the kernel list and
# leaves the kernel's all-interface binds open (needs Compose >= 2.24.4).
# PgBouncer is in the kernel (darex-pgbouncer, host 127.0.0.1:6432).
# Single-host compose + Caddy remains the supported production path.

# Caps container logs (default json-file is unbounded and filled the Azure VM disk) and runs
# tini as PID 1 (`init: true`) so healthcheck children are reaped instead of piling up as zombies.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT missing - load deploy/ports.env}:5432"
    restart: always

  pgbouncer:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:?PGBOUNCER_HOST_PORT missing - load deploy/ports.env}:5432"
    restart: always

  temporal:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${TEMPORAL_HOST_PORT:?TEMPORAL_HOST_PORT missing - load deploy/ports.env}:7233"
    restart: always

  temporal-ui:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:?TEMPORAL_UI_HOST_PORT missing - load deploy/ports.env}:8080"
    restart: always

  redis:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${REDIS_HOST_PORT:?REDIS_HOST_PORT missing - load deploy/ports.env}:6379"
    restart: always

  nango-server:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${NANGO_HOST_PORT:?NANGO_HOST_PORT missing - load deploy/ports.env}:3003"
    restart: always

  langfuse-clickhouse:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:?CLICKHOUSE_HTTP_HOST_PORT missing - load deploy/ports.env}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:?CLICKHOUSE_NATIVE_HOST_PORT missing - load deploy/ports.env}:9000"
    restart: always

  langfuse-minio:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${MINIO_API_HOST_PORT:?MINIO_API_HOST_PORT missing - load deploy/ports.env}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:?MINIO_CONSOLE_HOST_PORT missing - load deploy/ports.env}:9001"
    restart: always

  langfuse-server:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${LANGFUSE_HOST_PORT:?LANGFUSE_HOST_PORT missing - load deploy/ports.env}:3000"
    restart: always
    # First boot runs the Postgres and ClickHouse migrations, which takes several minutes on a
    # 2 vCPU VM; the base 45 s + 20 x 15 s window declared it unhealthy mid-migration and
    # `compose up` aborted. A longer window only delays the verdict, it does not hide a crash.
    healthcheck:
      start_period: 180s
      retries: 40

  langfuse-worker:
    init: true
    logging: *default-logging
    restart: always

  langfuse-redis:
    init: true
    logging: *default-logging
    restart: always

  supertokens:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${SUPERTOKENS_HOST_PORT:?SUPERTOKENS_HOST_PORT missing - load deploy/ports.env}:3567"
    restart: always

  litellm:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${LITELLM_HOST_PORT:?LITELLM_HOST_PORT missing - load deploy/ports.env}:4000"
    restart: always

  mcp-bridge:
    init: true
    ports: !override
      - "127.0.0.1:${MCP_BRIDGE_HOST_PORT:?MCP_BRIDGE_HOST_PORT missing - load deploy/ports.env}:8790"
    logging: *default-logging
    restart: always
    environment:
      - DAREX_PROD_FAILFAST=true
      - DB_USER=darex_app

  sandbox:
    init: true
    ports: !override
      - "127.0.0.1:${SANDBOX_HOST_PORT:?SANDBOX_HOST_PORT missing - load deploy/ports.env}:8080"
    logging: *default-logging
    restart: always

  inbox:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${INBOX_HOST_PORT:?INBOX_HOST_PORT missing - load deploy/ports.env}:3004"
    restart: always

  worker:
    init: true
    logging: *default-logging
    restart: always
    environment:
      - DAREX_PROD_FAILFAST=true
      - DB_USER=darex_app
      - ALLOW_DEMO_AUTH=false
      - TRUEFORGE_CHAT_MODEL=${TRUEFORGE_CHAT_MODEL:-openrouter/deepseek-v4-1-flash}

  # The user-facing app (NEW-FRONTEND). It proxies /api/* to the dashboard, so the reverse
  # proxy (Caddy/nginx) points at 127.0.0.1:${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT missing - load deploy/ports.env} and the session cookie stays same-origin.
  # deploy.sh pulls the frontend repo and rebuilds this image on every run.
  frontend:
    init: true
    logging: *default-logging
    image: darex-frontend:local
    build:
      context: ../NEW-FRONTEND
      dockerfile: ../infra/docker/frontend/Dockerfile
      args:
        DASHBOARD_URL: http://dashboard:3000
        TRUEFORGE_URL: http://trueforge:8790
    container_name: darex-frontend
    ports: !override
      - "127.0.0.1:${FRONTEND_HOST_PORT:?FRONTEND_HOST_PORT missing - load deploy/ports.env}:3100"
    restart: always
    mem_limit: 512m
    environment:
      - DASHBOARD_URL=http://dashboard:3000
      - TRUEFORGE_URL=http://trueforge:8790
    depends_on:
      dashboard:
        condition: service_started
    networks:
      - darex-net

  dashboard:
    init: true
    logging: *default-logging
    ports: !override
      - "127.0.0.1:${DASHBOARD_PORT:?DASHBOARD_PORT missing - load deploy/ports.env}:3000"
    restart: always
    environment:
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - ALLOW_DEMO_AUTH=false
      - DB_USER=darex_app
      - DAREX_PROD_FAILFAST=true
      - TRUEFORGE_CHAT_MODEL=${TRUEFORGE_CHAT_MODEL:-openrouter/deepseek-v4-1-flash}

  evolution:
    init: true
    ports: !override
      - "127.0.0.1:${EVOLUTION_PORT:?EVOLUTION_PORT missing - load deploy/ports.env}:8080"
    logging: *default-logging

  cognee:
    init: true
    logging: *default-logging

  hindsight:
    init: true
    logging: *default-logging

  hindsight-ui:
    init: true
    ports: !override
      - "127.0.0.1:${HINDSIGHT_UI_HOST_PORT:?HINDSIGHT_UI_HOST_PORT missing - load deploy/ports.env}:9999"
    logging: *default-logging

  trueforge:
    init: true
    logging: *default-logging
