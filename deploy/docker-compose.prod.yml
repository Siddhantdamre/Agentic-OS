# Production overlay for infra/docker-compose.yml.
# Callers: deploy/deploy.sh (via infra/scripts/compose-cmd.sh --overlay).
# Bind admin/data ports to loopback so they are not on the public internet.
# Put Caddy/nginx in front of 127.0.0.1:3000.
#
#   bash infra/scripts/compose-cmd.sh --overlay deploy/docker-compose.prod.yml up -d
#
# File order: kernel → compose-snippets → this overlay.
#
# "Later wins" is true for SCALARS and false for SEQUENCES: Compose APPENDS
# list values across files. Without the !override tags below, every `ports:`
# here was added to the kernel's list rather than replacing it, so the merged
# production config published fifteen ports twice and the stack died on the
# first bind with "address already in use".
#
# The security consequence was worse than the outage. The whole purpose of
# this file is to keep data ports off the public internet, and the kernel's
# "5432:5432" survived the merge — so a production deploy that had started
# would have published Postgres on every interface. !override replaces the
# list instead of extending it. Requires Compose >= 2.24.
# PgBouncer is in the kernel (darex-pgbouncer, host 127.0.0.1:6432).
# Single-host compose + Caddy remains the supported production path.

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"
    restart: always

  pgbouncer:
    ports: !override
      - "127.0.0.1:6432:5432"
    restart: always

  temporal:
    ports: !override
      - "127.0.0.1:7233:7233"
    restart: always

  temporal-ui:
    ports: !override
      - "127.0.0.1:8233:8080"
    restart: always

  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
    restart: always

  nango-server:
    ports: !override
      - "127.0.0.1:3003:3003"
    restart: always

  langfuse-clickhouse:
    ports: !override
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    restart: always

  langfuse-minio:
    ports: !override
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    restart: always

  langfuse-server:
    ports: !override
      - "127.0.0.1:3002:3000"
    restart: always

  langfuse-worker:
    restart: always

  langfuse-redis:
    restart: always

  supertokens:
    ports: !override
      - "127.0.0.1:3567:3567"
    restart: always

  litellm:
    ports: !override
      - "127.0.0.1:4000:4000"
    restart: always

  atomic-bridge:
    restart: always
    environment:
      - DAREX_PROD_FAILFAST=true
      - DB_USER=darex_app

  atomic-agent:
    restart: always

  sandbox:
    restart: always

  inbox:
    ports: !override
      - "127.0.0.1:3004:3004"
    restart: always

  worker:
    restart: always
    environment:
      - DAREX_PROD_FAILFAST=true
      - DB_USER=darex_app
      - ALLOW_DEMO_AUTH=false

  dashboard:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: always
    environment:
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - ALLOW_DEMO_AUTH=false
      - DB_USER=darex_app
      - DAREX_PROD_FAILFAST=true
